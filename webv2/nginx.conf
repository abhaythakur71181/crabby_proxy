# webv2 static serve + same-origin API proxy.
# CRABBY_BACKEND is resolved at container start via envsubst by the nginx
# image's docker-entrypoint templates — or hardcode the upstream here.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────
    # NOTE: nginx drops every inherited add_header in a location that sets its
    # own add_header, so any location below that adds a header must repeat
    # this block (see /assets/).
    #
    # CSP — what the built bundle actually needs:
    #   script-src 'self'          all JS is in /assets + /theme-boot.js (no inline script)
    #   style-src 'unsafe-inline'  sonner and Radix (react-remove-scroll) inject
    #                              <style> elements at runtime; style injection is
    #                              far less dangerous than script injection
    #   img-src/font-src data:     favicon is a data: SVG; Vite may inline small fonts
    #   connect-src 'self'         API, /health and the live WebSocket are all
    #                              same-origin via the proxy below ('self' covers
    #                              ws:/wss: to the same host in CSP3 browsers).
    #                              If you build with a cross-origin
    #                              VITE_API_BASE_URL, add that origin (and its
    #                              ws/wss form) here.
    #   frame-ancestors 'none'     clickjacking defence for destructive admin actions
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Browsers ignore HSTS on plain HTTP, so this is inert on :8080 directly and
    # takes effect when a TLS-terminating proxy forwards it. No includeSubDomains
    # / preload: that is a domain-wide decision for the operator.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Static assets are content-hashed — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Same-origin API proxy → Rust admin API (compose service name).
    # WebSocket upgrade headers cover /api/connections/live.
    location /api/ {
        proxy_pass http://crabby-proxy:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Backend health endpoints (the SPA page lives at /system-health).
    location /health {
        proxy_pass http://crabby-proxy:8081;
        proxy_set_header Host $host;
    }

    # Container liveness (distinct from the backend's /health).
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
