# webv2 static serve + same-origin API proxy.
# CRABBY_BACKEND is resolved at container start via envsubst by the nginx
# image's docker-entrypoint templates — or hardcode the upstream here.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Same-origin API proxy → Rust admin API (compose service name).
    # WebSocket upgrade headers cover /api/connections/live.
    location /api/ {
        proxy_pass http://crabby-proxy:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Backend health endpoints (the SPA page lives at /system-health).
    location /health {
        proxy_pass http://crabby-proxy:8081;
        proxy_set_header Host $host;
    }

    # Container liveness (distinct from the backend's /health).
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
