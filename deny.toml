# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
#
# CI runs `cargo deny check bans licenses sources`. Vulnerability advisories
# are gated by the separate cargo-audit job; the [advisories] section below
# mirrors its ignore list so a local `cargo deny check` agrees with CI. Keep the
# two lists in sync (.github/workflows/ci.yml, job `audit`).

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # rsa "Marvin" timing side channel, pulled in by jsonwebtoken. Only HS256
    # (HMAC) is used, so the RSA code path is never exercised; no fixed rsa
    # release exists.
    { id = "RUSTSEC-2023-0071", reason = "RSA path unused (HS256 only); no fixed release" },
    # Bundled SQLite < 3.54 (libsqlite3-sys 0.30 via sqlx 0.8). Needs a DB/-wal
    # pair written by a less-trusted party; proxy.db is private to the proxy.
    # Remove with the sqlx 0.9 upgrade (libsqlite3-sys 0.39).
    { id = "RUSTSEC-2026-0459", reason = "only exploitable via attacker-written DB/WAL files; fixed by sqlx 0.9" },
]

[licenses]
# Permissive licenses only. Adding a copyleft license here is a product
# decision, not a CI fix.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# crabby_proxy itself is `publish = false`.
ignore = true

[bans]
# Duplicate versions are common in the async ecosystem; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
