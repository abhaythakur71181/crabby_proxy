[package]
name = "crabby_proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.98"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22.1"
byte-pool = "0.2.4"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
config = "0.15.19"
jsonwebtoken = { version = "10.3.0", features = ["default", "aws_lc_rs"] }
lazy_static = "1.5.0"
notify = "8.2.0"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.5.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
tokio-rustls = "0.26.4"
toml = "0.9.11"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "fmt", "env-filter"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
rand = "0.8"
governor = "0.10"
nonzero_ext = "0.3"
ipnet = "2.9"
prometheus = "0.14"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager", "tls-rustls", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
lru = "0.19"
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
maxminddb = "0.27"
futures-lite = "2"
h2 = "0.4"
http = "1"
http-body = "1"
bytes = "1"
chrono-tz = "0.10.4"
arc-swap = "1.9.0"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
hickory-resolver = "0.26"

[dev-dependencies]
serial_test = "3.1"
toml = "0.9.11"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
rcgen = "0.14"
tokio = { version = "1", features = ["test-util"] }
