name: crabby-proxy

# Image tags: set CRABBY_IMAGE_TAG to a release version or git SHA, e.g.
#   CRABBY_IMAGE_TAG=$(git rev-parse --short HEAD) docker compose build
# so every build stays addressable and a previous tag is a rollback target
# (see docs/RUNBOOK.md, "Releases & rollback"). Unset, it falls back to
# :latest as a local convenience only.

services:
  crabby-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        RUST_VERSION: "1.97"
    image: crabby-proxy:${CRABBY_IMAGE_TAG:-latest}
    container_name: crabby-proxy
    restart: unless-stopped

    # One replica as shipped (the baked config uses [state] backend =
    # "memory", and container_name / fixed host ports below prevent
    # `--scale`). For several replicas on this host: start the `redis`
    # profile, mount a config.toml with backend = "redis" and
    # redis_url = "redis://crabby-redis:6379", drop container_name and the
    # host ports in an override file, and put a TCP load balancer in front.
    # All replicas share the crabby-data volume (same-host SQLite only). See
    # docs/RUNBOOK.md, "Scaling".
    #
    # Secrets are loaded from .env. Required — container refuses to start
    # if CRABBY_JWT_SECRET is unset (config_env.rs panics on weak secrets).
    environment:
      CRABBY_JWT_SECRET: ${CRABBY_JWT_SECRET:?set CRABBY_JWT_SECRET in .env (>=32 bytes)}
      CRABBY_ADMIN_PASSWORD: ${CRABBY_ADMIN_PASSWORD:?set CRABBY_ADMIN_PASSWORD in .env}
      CRABBY_BASIC_AUTH_PASSWORD: ${CRABBY_BASIC_AUTH_PASSWORD:?set CRABBY_BASIC_AUTH_PASSWORD in .env}
      RUST_LOG: ${RUST_LOG:-info}
      # /metrics: the admin API binds 0.0.0.0 inside the container, so
      # Prometheus must send this as a bearer token (it answers 403 without
      # one). ALLOW_UNAUTHENTICATED=true drops the token requirement; use it
      # only when the admin port is otherwise restricted.
      PROXY__METRICS__SCRAPE_TOKEN: ${CRABBY_METRICS_SCRAPE_TOKEN:-}
      PROXY__METRICS__ALLOW_UNAUTHENTICATED: ${CRABBY_METRICS_ALLOW_UNAUTHENTICATED:-false}

    ports:
      - "${PROXY_PORT:-8080}:8080"
      # Admin API + /metrics bind to localhost on the host by default — the
      # admin surface must not be world-reachable.
      # Override ADMIN_BIND_HOST=0.0.0.0 only behind a firewall / private net.
      - "${ADMIN_BIND_HOST:-127.0.0.1}:${ADMIN_PORT:-8081}:8081"

    volumes:
      # SQLite DB + any app-writable state. Persisted across restarts.
      - crabby-data:/app/data
      # Optional: override baked-in config with a host file (read-only).
      # Uncomment to use:
      # - ./config.toml:/app/config.toml:ro

    # Resource ceilings so a connection flood or leak in the proxy cannot
    # starve the host and every co-located service. Defaults suit a small VM;
    # raise them via .env for high-traffic deployments (watch the container's
    # memory against max_connections x buffer_size in config.toml). The pids
    # ceiling leaves room for tokio's blocking pool (up to 512 threads, used
    # for DNS lookups) plus SQLite worker threads.
    mem_limit: ${PROXY_MEM_LIMIT:-1g}
    memswap_limit: ${PROXY_MEM_LIMIT:-1g}
    cpus: ${PROXY_CPUS:-2.0}
    pids_limit: ${PROXY_PIDS_LIMIT:-4096}

    # File descriptor bump — proxy opens lots of sockets under load.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # Kernel networking niceties for a forward proxy.
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_fin_timeout: "15"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Admin console (webv2) — static SPA behind nginx with a same-origin /api
  # proxy (no CORS config needed on the backend). The only shipped UI; the
  # legacy web/ app has been removed.
  crabby-webv2:
    build:
      context: ./webv2
      dockerfile: Dockerfile
      args:
        BUN_VERSION: "1"
    image: crabby-proxy-webv2:${CRABBY_IMAGE_TAG:-latest}
    container_name: crabby-proxy-webv2
    restart: unless-stopped

    depends_on:
      crabby-proxy:
        condition: service_healthy

    ports:
      - "${WEBV2_PORT:-3001}:8080"

    # Static files + a reverse proxy: needs very little.
    mem_limit: ${WEBV2_MEM_LIMIT:-128m}
    memswap_limit: ${WEBV2_MEM_LIMIT:-128m}
    cpus: ${WEBV2_CPUS:-0.5}
    pids_limit: ${WEBV2_PIDS_LIMIT:-512}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional Redis for the multi-replica configuration ([state] backend =
  # "redis"). Off by default; enable with
  #   docker compose --profile redis up -d
  # Not published on the host. Persistence is on (AOF) so shared quota
  # counters survive a Redis restart; the proxy also restores a lost counter
  # to the last value it saw.
  crabby-redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    container_name: crabby-proxy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - crabby-redis:/data
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional SQLite backup sidecar. Off by default; enable with
  #   docker compose --profile backup up -d
  # Takes an online, integrity-checked `.backup` snapshot of proxy.db every
  # BACKUP_INTERVAL_SECONDS into BACKUP_DIR on the host, pruning snapshots
  # older than BACKUP_RETENTION_DAYS. Ship BACKUP_DIR off-host yourself
  # (restic/rclone/rsync): a backup on the same disk is not disaster recovery.
  # One-shot (e.g. from host cron):
  #   docker compose --profile backup run --rm --no-deps -e INTERVAL_SECONDS= crabby-backup
  # Restore procedure: docs/RUNBOOK.md, "Backup & restore".
  crabby-backup:
    image: alpine:3.20
    profiles: ["backup"]
    container_name: crabby-proxy-backup
    restart: unless-stopped
    # Starts as root only to install sqlite3 and hand BACKUP_DIR to the app
    # uid, then drops to that uid so any -wal/-shm file it touches in the
    # shared volume stays owned by the proxy user.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        apk add --no-cache sqlite su-exec >/dev/null &&
        mkdir -p /backups && chown 10001:10001 /backups &&
        exec su-exec 10001:10001 /bin/sh /usr/local/bin/backup-sqlite.sh
    environment:
      DB_PATH: /app/data/proxy.db
      BACKUP_DIR: /backups
      INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - crabby-data:/app/data
      - ./scripts/backup-sqlite.sh:/usr/local/bin/backup-sqlite.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crabby-data:
    driver: local
  crabby-redis:
    driver: local
