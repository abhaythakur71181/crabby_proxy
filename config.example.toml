# Example configuration baked into the Docker image as /app/config.toml.
# Secrets here are PLACEHOLDERS — the boot guard (src/config_env.rs) refuses to
# start on default credentials, so supply real values at runtime via env vars
# (CRABBY_ADMIN_PASSWORD, CRABBY_JWT_SECRET, ...) or CLI flags. Never commit real
# secrets to this file.

[server]
proxy_bind = "0.0.0.0:8080"
admin_bind = "127.0.0.1:8081"
max_connections = 10000
connection_timeout = 30
tls_enabled = false
tls_cert_path = ""
tls_key_path = ""

[database]
# Single-colon form so the Dockerfile can rewrite it to the /app/data volume.
path = "sqlite:proxy.db"
# Size of the READ pool. Writes (usage records, sessions, last-login, API-key
# last-used, admin changes) go through one extra, dedicated writer connection,
# so they queue in order instead of competing for SQLite's single write lock.
# Watch proxy_db_write_acquire_seconds and proxy_db_contention_errors_total.
max_connections = 10
# Delete usage rows older than this many days (per-user destination history is
# sensitive PII and grows without bound). 0 disables purging.
usage_retention_days = 90
# SQLite allows one writer at a time (WAL). A write waits up to busy_timeout_ms
# for the lock when another process holds it; requests wait up to
# acquire_timeout_secs for a pooled (or the writer) connection. Keep
# acquire_timeout_secs * 1000 above busy_timeout_ms.
busy_timeout_ms = 5000
acquire_timeout_secs = 10

[authentication]
enabled = true
method = "basic"
username = "admin"
password = "REPLACE_ME"
jwt_secret = "REPLACE_ME_WITH_A_32_BYTE_RANDOM_SECRET"
jwt_expiration = 86400

[protocols]
enable_http = true
enable_https = true
enable_socks4 = true
enable_socks5 = true
auto_detect = true

[features]
connection_approval = false
approval_timeout = 300
reverse_tunnels = false
tunnel_port_start = 10000
tunnel_port_end = 10999
# Interface tunnel listeners bind to (tunnels relay raw TCP without auth).
tunnel_bind_addr = "127.0.0.1"
# Internal targets (CIDRs/IPs) tunnels may reach; loopback/private/link-local
# targets are refused unless listed. Non-empty = strict allow-list.
tunnel_allowed_targets = []
# Max concurrent connections per tunnel (0 = unlimited).
tunnel_max_connections = 100
# Optional event webhook. Must be https; internal / non-routable targets are
# refused (startup error) unless webhook_allow_private_targets = true. Client
# IPs and destinations are stripped from payloads unless webhook_include_pii.
# webhook_url = "https://hooks.example.com/crabby"
webhook_events = []
# webhook_allow_private_targets = false
# webhook_include_pii = false

[state]
# Where live connection state, pending approvals and counters are kept.
#   "memory" (default): in-process. Correct for the supported topology, ONE
#     proxy instance per SQLite database; nothing extra to run.
#   "redis": shares that state through redis_url. This alone does NOT make the
#     proxy horizontally scalable: rate limiting stays in-process, SQLite is a
#     single-writer local file, and an unreachable Redis at boot silently falls
#     back to "memory". Do not run more than one replica. See docs/RUNBOOK.md,
#     "Scaling (single-instance constraint)".
backend = "memory"
redis_url = "redis://localhost:6379"
redis_pool_size = 10
redis_key_prefix = "crabby_proxy:"
redis_connection_timeout = 5

[rate_limiting]
enabled = true
requests_per_second = 100
burst_size = 200
ban_duration = 300

[filtering]
ip_allowlist = []
ip_blocklist = []
# Geo blocking needs a MaxMind GeoLite2-Country database. When
# geo_blocking_enabled = true the database is mandatory: the proxy refuses to
# start (and a config reload is rejected) if geoip_database_path is unset or the
# file cannot be loaded, instead of silently allowing every country.
geo_blocking_enabled = false
blocked_countries = []
# allowed_countries = []          # if non-empty, ONLY these countries may connect
# geoip_database_path = "/app/data/GeoLite2-Country.mmdb"
# SSRF egress guard is ON by default in code (block_private_targets); leave it on
# unless this instance intentionally proxies to internal/same-machine targets.
# Post-auth rules admin/root_admin connections may bypass. Each bypass that skips
# an actual denial is audit-logged and counted in proxy_admin_bypass_total{rule}.
# Remove entries to hold admins to a rule. Default (when omitted) = all of these:
# admin_bypass_rules = ["socks4_disabled", "allowed_protocols", "approval",
#   "user_rate_limit", "target_filter", "access_schedule", "quota", "connection_limit"]

[logging]
level = "info"
format = "pretty"
file_enabled = false
file_path = "proxy.log"
# Per-connection access log (target "access_log"): client IP, destination
# host:port, user id, bytes, duration. This is effectively per-user browsing
# history -- set access_log_enabled = false, or reduce the client IP with
# access_log_client_ip = "truncated" (IPv4 /24, IPv6 /48) or "omit", where
# privacy rules require it. Events go to the process log output; route or drop
# them with RUST_LOG (e.g. "info,access_log=off") or your log collector, and
# apply a retention period there. Security decisions are logged separately on
# the "audit" target. access_log_path is reserved (not yet used).
access_log_enabled = true
access_log_path = "access.log"
# access_log_client_ip = "full"

[metrics]
enabled = true
prometheus_path = "/metrics"
update_interval = 10
# Optional bearer token required to scrape /metrics (Prometheus
# `authorization: { credentials: ... }`). Unset = unauthenticated; only safe
# when the admin API is bound to loopback / a private network.
# scrape_token = "REPLACE_WITH_RANDOM_TOKEN"

[admin]
enabled = true
auth_enabled = true
admin_username = "admin"
admin_password = "REPLACE_ME"
websocket_enabled = true
cors_enabled = true
cors_origins = ["http://localhost:3000"]
# Secure attribute on the webv2 session cookie. Leave on for HTTPS (and
# http://localhost); set false only for a plain-HTTP UI on a trusted network.
session_cookie_secure = true

[advanced]
buffer_size = 8192
# connection_pooling / pool_max_idle_per_host are deprecated and ignored.
connection_pooling = false
pool_max_idle_per_host = 10
http2_enabled = false
dns_cache_ttl = 300
