# Crabby Proxy — web SPA served by nginx.
# Proxies API/admin traffic to the backend container on port 8081.

upstream crabby_admin {
    server crabby-proxy:8081;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. CSP kept permissive for inline Vite runtime.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Gzip static assets.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/ttf
                      font/otf font/woff font/woff2;

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxied admin API paths → backend.
    location ~ ^/(api|health|metrics|stats)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass         http://crabby_admin;
    }

    # SPA fallback — let React Router handle unknown routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't log the health pings.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
