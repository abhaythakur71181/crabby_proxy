name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job gets a read-only token unless it asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to the commit of the action's `stable` branch; the toolchain
      # itself still tracks the latest stable Rust via `toolchain:`.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      # Integration tests bind sockets and must run single-threaded.
      - name: Test
        run: cargo test --locked -- --test-threads=1

  audit:
    name: Supply-chain — cargo audit
    runs-on: ubuntu-latest
    # audit-check publishes its report as a check run. Job-level permissions
    # replace the workflow-level block, so contents: read is restated.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Justified, non-applicable-to-us advisories (keep in sync with
          # deny.toml [advisories].ignore):
          #  RUSTSEC-2023-0071 (rsa/Marvin): only HS256 (HMAC) is used via
          #    jsonwebtoken; the RSA code path is never exercised, and no fixed
          #    rsa release exists.
          #  RUSTSEC-2026-0459 (bundled SQLite < 3.54 in libsqlite3-sys 0.30,
          #    via sqlx 0.8): only exploitable by opening a DB + -wal pair that
          #    a less-trusted party wrote. proxy.db lives in a private volume
          #    written only by the proxy. Fixed by sqlx 0.9 (libsqlite3-sys
          #    0.39); remove this ignore with that upgrade.
          # No longer ignored after the #85 bump: RUSTSEC-2025-0132 (maxminddb
          # 0.27 makes open_mmap unsafe) and RUSTSEC-2024-0437 (prometheus 0.14
          # pulls the patched protobuf 3.7.2).
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0459

  deny:
    name: Supply-chain — cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Policy lives in deny.toml. Advisories are gated by the audit job above.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  secrets:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits through the API to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  webv2:
    name: Web (v2) — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in step with the bun that writes webv2/bun.lock.
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  docker:
    name: Docker — build & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        # compose's ${VAR:?} guards only need these to be non-empty; nothing
        # starts, so the values are dummies.
        env:
          CRABBY_JWT_SECRET: x
          CRABBY_ADMIN_PASSWORD: x
          CRABBY_BASIC_AUTH_PASSWORD: x
        run: docker compose --profile backup config --quiet
      - name: Build image
        run: docker build -t crabby-proxy:ci .
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: crabby-proxy:ci
          format: cyclonedx-json
          output-file: crabby-proxy.cdx.json
          artifact-name: crabby-proxy-sbom.cdx.json
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crabby-proxy:ci
          format: table
          exit-code: "1" # gate: fail the build on findings
          ignore-unfixed: true # don't block on base-image CVEs with no fix available
          severity: CRITICAL,HIGH
