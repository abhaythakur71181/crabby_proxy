name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      # Integration tests bind sockets and must run single-threaded.
      - name: Test
        run: cargo test --locked -- --test-threads=1

  audit:
    name: Supply-chain — cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Justified, non-applicable-to-us advisories with no reachable fix.
          # Revisit on the dependency-bump pass (#11).
          #  RUSTSEC-2023-0071 (rsa/Marvin): only HS256 (HMAC) is used via
          #    jsonwebtoken; the RSA code path is never exercised, and no fixed
          #    rsa release exists.
          #  RUSTSEC-2025-0132 (maxminddb): unsound `open_mmap`; we call
          #    `Reader::open_readfile`, not the mmap path.
          #  RUSTSEC-2024-0437 (protobuf via prometheus): recursion crash when
          #    parsing untrusted protobuf; we only emit the text exposition
          #    format and never parse protobuf input.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2025-0132,RUSTSEC-2024-0437

  secrets:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  webv2:
    name: Web (v2) — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webv2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  docker:
    name: Docker — build & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crabby-proxy:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crabby-proxy:ci
          format: table
          exit-code: "1" # gate: fail the build on findings
          ignore-unfixed: true # don't block on base-image CVEs with no fix available
          severity: CRITICAL,HIGH
